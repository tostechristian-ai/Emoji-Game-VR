<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emoji Survivor VR - Modular</title>
  <style>
    body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:Inter, Arial; }
    #modeMenu, #upgradeMenuVR { position:absolute; width:100%; text-align:center; z-index:9999; }
    #modeMenu { top:40%; }
    #modeMenu button { font-size:24px; padding:14px 22px; margin:8px; }
    #upgradeMenuVR { top:20%; display:none; }
    #upgradeMenuVR button { font-size:20px; padding:12px 18px; margin:8px; }
    #info { position:absolute; top:8px; width:100%; text-align:center; z-index:1000; pointer-events:none; }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <h1 style="margin:0; font-size:20px;">Emoji Survivor VR</h1>
    <p style="margin:0; font-size:12px;">Left stick to move — auto-fire active</p>
  </div>
  <div id="modeMenu">
    <button id="fpBtn">FIRST PERSON</button>
    <button id="tpBtn">THIRD PERSON</button>
  </div>
  <div id="upgradeMenuVR">
    <h2>Choose an Upgrade</h2>
    <div id="upgradeOptions"></div>
    <div style="margin-top:8px;"><button id="closeUpgradeBtn">Close (auto apply none)</button></div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
